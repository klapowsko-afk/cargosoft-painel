name: Sincronizar Bases ANP (Revenda e Distribuição)

on:
  schedule:
    # Executa automaticamente todas as segundas-feiras às 09:00 UTC (06:00 de Brasília)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Permite acionar manualmente a qualquer momento pelo botão "Run workflow"

jobs:
  atualizar-anp:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl firebase-admin

      - name: Executar extração e carga no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python atualizar_anp.py
